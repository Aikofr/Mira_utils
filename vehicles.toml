# Catalogue des véhicules de la commande F8 `car <name>` (module vehicles de mira_utils).
# Après une modification : `restart <nom du dossier>` (ex. `restart mira_utils`).
#
# Pour ajouter un véhicule, copier un bloc [[vehicle]] :
#   name       = nom court tapé après `car` (unique, minuscules, sans espace)
#   label      = nom affiché
#   category   = sport, street, offroad, bike… (libre, sert à `carlist <catégorie>`)
#   model      = record TweakDB du véhicule ("Vehicle.v_…")
#   appearance = apparence (peinture/variante) correspondant à ce modèle
#   tested     = false tant qu'il n'a pas été essayé en jeu (carlist affiche « non testé » ;
#                `carlist untested` liste ceux qui restent à essayer). Absent = testé.
#
# Liste de départ : 39 véhicules repris de CyberMP-Freeroam (licence MIT,
# github.com/Cyber-MP/CyberMP-Freeroam, server/src/modules/vehicles-spawner/vehicles.repository.ts).

